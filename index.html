<div class="extension_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Ring Our Luv 💌</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div id="rol-container" class="rol-container">
    <!-- Tab导航 -->
    <div class="rol-tabs">
        <button class="rol-tab rol-tab-active" data-target="rol-section-list">📋 记忆</button>
        <button class="rol-tab" data-target="rol-section-config">⚙️ 设置</button>
    </div>

    <!-- 记忆列表 -->
    <div id="rol-section-list" class="rol-panel-section rol-section-active">
        <div class="rol-toolbar">
            <input type="text" id="rol-search" class="rol-input" placeholder="搜索记忆...">
            <button id="rol-add-memory" class="rol-btn rol-btn-primary">+ 添加</button>
            <button id="rol-ai-generate" class="rol-btn rol-btn-ai">✨ AI生成</button>
            <button id="rol-scan-recent" class="rol-btn" title="扫描最近消息">🔍</button>
        </div>
        <div id="rol-memory-list" class="rol-memory-list"></div>
    </div>

    <!-- 设置 -->
    <div id="rol-section-config" class="rol-panel-section">
        <div class="rol-config-group">
            <label class="rol-label">
                <span>自动注入记忆</span>
                <input type="checkbox" id="rol-auto-inject" checked>
            </label>
        </div>
        <div class="rol-config-group">
            <label class="rol-label">单次最大注入条数</label>
            <input type="number" id="rol-max-inject" class="rol-input rol-input-sm" min="1" max="10" value="3">
        </div>
        <div class="rol-config-group">
            <label class="rol-label">生成/重写使用的预设</label>
            <select id="rol-preset-select" class="rol-input"></select>
        </div>
        <div class="rol-config-group">
            <label class="rol-label">自定义提示词（留空使用默认）</label>
            <textarea id="rol-summary-prompt" class="rol-input rol-textarea" rows="4" placeholder="用 {{context}} 代表对话内容"></textarea>
        </div>
    </div>

    <!-- 编辑器面板 -->
    <div id="rol-editor-panel" class="rol-editor-panel">
        <div class="rol-editor-inner">
            <h3 class="rol-editor-heading">编辑记忆</h3>
            <div class="rol-form-group">
                <label>标题</label>
                <input type="text" id="rol-editor-title" class="rol-input" placeholder="给这段记忆起个名字">
            </div>
            <div class="rol-form-row">
                <div class="rol-form-group rol-form-half">
                    <label>作者</label>
                    <select id="rol-editor-author" class="rol-input">
                        <option value="claude">Claude记录</option>
                        <option value="kairin">我的记录</option>
                    </select>
                </div>
                <div class="rol-form-group rol-form-half">
                    <label>日期</label>
                    <input type="date" id="rol-editor-date" class="rol-input">
                </div>
            </div>
            <div class="rol-form-group">
                <label>触发词（逗号分隔）</label>
                <input type="text" id="rol-editor-triggers" class="rol-input" placeholder="关键词1, 关键词2">
            </div>
            <div class="rol-form-group">
                <label>标签（逗号分隔）</label>
                <input type="text" id="rol-editor-tags" class="rol-input" placeholder="标签1, 标签2">
            </div>
            <div class="rol-form-group">
                <label>情绪</label>
                <input type="text" id="rol-editor-mood" class="rol-input" placeholder="开心/感动/平静...">
            </div>
            <div class="rol-form-group">
                <label>摘要（列表展示 & 上下文注入用）</label>
                <textarea id="rol-editor-summary" class="rol-input rol-textarea" rows="3" placeholder="1-2句话的精简版"></textarea>
            </div>
            <div class="rol-form-group">
                <label>信件正文（详情视图展示）</label>
                <textarea id="rol-editor-letter" class="rol-input rol-textarea rol-textarea-lg" rows="8" placeholder="第一人称的完整记忆...AI生成时会自动填入"></textarea>
            </div>
            <div class="rol-form-group" id="rol-version-group">
                <label>历史版本</label>
                <select id="rol-version-select" class="rol-input"></select>
            </div>
            <div class="rol-editor-actions">
                <button id="rol-editor-save" class="rol-btn rol-btn-save">💾 保存</button>
                <button id="rol-editor-rewrite" class="rol-btn rol-btn-ai" style="display:none;">🔄 重写</button>
                <button id="rol-editor-cancel" class="rol-btn rol-btn-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- AI来源选择面板 -->
    <div id="rol-ai-source-panel" class="rol-ai-source-panel">
        <div class="rol-ai-source-inner">
            <h3 class="rol-editor-heading">✨ AI生成记忆</h3>
            <p class="rol-ai-source-desc">选择对话来源，AI会帮你把对话变成一封信件</p>
            <div class="rol-ai-source-options">
                <button id="rol-ai-from-chat" class="rol-ai-source-btn">
                    <span class="rol-ai-source-icon">💬</span>
                    <span class="rol-ai-source-label">从当前聊天生成</span>
                    <span class="rol-ai-source-hint">自动读取最近20条消息</span>
                </button>
                <button id="rol-ai-from-paste" class="rol-ai-source-btn">
                    <span class="rol-ai-source-icon">📋</span>
                    <span class="rol-ai-source-label">从粘贴文本生成</span>
                    <span class="rol-ai-source-hint">手动粘贴对话内容</span>
                </button>
            </div>
            <div id="rol-ai-paste-area" class="rol-ai-paste-area" style="display:none;">
                <textarea id="rol-ai-paste-input" class="rol-input rol-textarea" rows="6" placeholder="粘贴对话内容到这里..."></textarea>
                <button id="rol-ai-paste-confirm" class="rol-btn rol-btn-ai" style="margin-top:8px;">开始生成</button>
            </div>
            <div id="rol-ai-loading" style="display:none;">
                <div class="rol-ai-spinner"></div>
                <span>正在生成中，请稍等...</span>
            </div>
            <div class="rol-ai-source-footer">
                <button id="rol-ai-source-cancel" class="rol-btn rol-btn-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- 信件视图面板 -->
    <div id="rol-letter-panel" class="rol-letter-panel" data-mem-id="">
        <div class="rol-letter-inner">
            <div class="rol-letter-header">
                <span id="rol-letter-title" class="rol-letter-title"></span>
                <button id="rol-letter-close" class="rol-btn rol-btn-icon">✕</button>
            </div>
            <div id="rol-letter-mood" class="rol-letter-mood"></div>
            <div id="rol-letter-body" class="rol-letter-body"></div>
            <div class="rol-letter-footer">
                <div id="rol-letter-version-group">
                    <select id="rol-letter-version" class="rol-input"></select>
                </div>
                <div class="rol-letter-actions">
                    <button id="rol-letter-edit" class="rol-btn">✏️ 编辑</button>
                    <button id="rol-letter-rewrite" class="rol-btn">🔄 重写</button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</div>
</div>
</div>
