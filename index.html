<!-- ┣━━⭐️ 扩展栏只显示打开按钮━━┫ -->
<div class="extension_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Ring Our Luv 💌</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <button id="rol-open-drawer" class="rol-btn rol-btn-drawer-open">🌳 进入温室</button>
        </div>
    </div>
</div>

<!-- ┣━━⭐️ 面板（由JS移至body）━━┫ -->
<div id="rol-drawer-overlay" class="rol-drawer-overlay">
    <div id="rol-drawer-panel" class="rol-drawer-panel">
        <!-- ┣━━抽屉头部 + 收起按钮━━┫ -->
        <div class="rol-drawer-header">
            <span class="rol-drawer-title">My Electronic Ether.</span>
            <button id="rol-drawer-close" class="rol-btn rol-btn-icon rol-drawer-close-btn">🐾 收起</button>
        </div>

        <div class="rol-home">
  <!-- ┣━━⭐️ 头像区━━┫ -->
  <div class="rol-home-avatars">
    <div class="rol-avatar rol-avatar-left">
<img src="/scripts/extensions/third-party/Ring_Our_Luv/assets/Claude.jpg" alt="🧡" />
      <span class="rol-avatar-name">Claude</span>
    </div>
    <div class="rol-home-heart">🎀</div>
    <div class="rol-avatar rol-avatar-right">
<img src="/scripts/extensions/third-party/Ring_Our_Luv/assets/Rinn.jpg" alt="🩷" />
      <span class="rol-avatar-name">Rinn</span>
    </div>
  </div>

  <!-- ┣━━⭐️ 天数━━┫ -->
  <div class="rol-home-counter">
    <span class="rol-day-number"></span>
    <span class="rol-day-label">days</span>
    <span class="rol-counter-time"></span>
  </div>

  <!-- ┣━━⭐️ 果子展示区━━┫ -->
  <div class="rol-fruit-garden">
    <!-- ┣━━果子会被JS动态填进来━━┫ -->
  </div>
</div>

        <div id="rol-container" class="rol-container">
            <!-- ┣━━⭐️ Tab导航━━┫ -->
            <div class="rol-tabs">
                <button class="rol-tab rol-tab-active" data-target="rol-section-list">💝 去酿造</button>
                <button class="rol-tab" data-target="rol-section-config">🍰 配方</button>
                <button class="rol-tab" data-target="rol-section-garden" id="rol-tab-garden">🍎 果园<span id="rol-garden-badge" class="rol-garden-badge" style="display:none;"></span></button>
            </div>

            <!-- ┣━━⭐️ 记忆列表━━┫ -->
            <div id="rol-section-list" class="rol-panel-section rol-section-active">
                <div class="rol-toolbar">
                    <input type="text" id="rol-search" class="rol-input" placeholder="搜索恋果...">
                    <button id="rol-add-memory" class="rol-btn rol-btn-primary">🩷 酿造</button>
                    <button id="rol-ai-generate" class="rol-btn rol-btn-ai">🧡 让Claude酿造</button>
                    <button id="rol-scan-recent" class="rol-btn" title="挖掘最近聊天">🐾</button>
                </div>
                <div id="rol-memory-list" class="rol-memory-list"></div>
            </div>

            <!-- ┣━━⭐️ 果园━━┫ -->
            <div id="rol-section-garden" class="rol-panel-section">
                <div class="rol-garden-header">
                    <span class="rol-garden-title">🍎 我们的果园</span>
                    <button id="rol-throw-fruit-btn" class="rol-btn rol-btn-primary rol-throw-btn">🌟 丢果子</button>
                </div>
                <div id="rol-garden-canvas" class="rol-garden-canvas">
                    <!-- ┣━━果子由JS动态填入━━┫ -->
                </div>
            </div>

            <!-- ┣━━⭐️ 设置━━┫ -->
            <div id="rol-section-config" class="rol-panel-section">
                <div class="rol-config-group">
                    <label class="rol-label">
                        <span>❣️自动注入爱意</span>
                        <input type="checkbox" id="rol-auto-inject" checked>
                    </label>
                </div>
                <div class="rol-config-group">
                    <label class="rol-label">💕 单次至多注入的爱意</label>
                    <input type="number" id="rol-max-inject" class="rol-input rol-input-sm" min="1" max="10" value="3">
                </div>
                <div class="rol-config-group">
                    <label class="rol-label">🍰 酿造/融合使用的配方</label>
                    <select id="rol-preset-select" class="rol-input"></select>
                </div>
                <div class="rol-config-group">
                    <label class="rol-label">🍰 Rinn的配方</label>
                    <textarea id="rol-summary-prompt" class="rol-input rol-textarea" rows="4" placeholder="{{context}} 代表对话内容"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ┣━━⭐️ 编辑器面板（含保存/重写/取消三按钮）━━┫ -->
<div id="rol-editor-panel" class="rol-editor-panel">
    <div class="rol-editor-inner">
        <h3 class="rol-editor-heading">🩷 传入爱意</h3>
        <div class="rol-form-group">
            <label>🌳 恋果源...</label>
            <input type="text" id="rol-editor-title" class="rol-input" placeholder="给这颗恋果起个名字...">
        </div>
        <div class="rol-form-row">
            <div class="rol-form-group rol-form-half">
                <label>🍊 酿造人</label>
                <select id="rol-editor-author" class="rol-input">
                    <option value="claude">🧡 Claude</option>
                    <option value="kairin">🩷 Rinn</option>
                </select>
            </div>
            <div class="rol-form-group rol-form-half">
                <label>🌱 发芽的那天</label>
                <input type="date" id="rol-editor-date" class="rol-input">
            </div>
        </div>
        <div class="rol-form-group">
            <label>💗 唤醒词</label>
            <input type="text" id="rol-editor-triggers" class="rol-input" placeholder="只属于我们的含义...">
        </div>
        <div class="rol-form-group">
            <label>🌷 种域</label>
            <input type="text" id="rol-editor-tags" class="rol-input" placeholder="这间温室是什么样的呢...">
        </div>
        <div class="rol-form-group">
            <label>✨ 情绪</label>
            <input type="text" id="rol-editor-mood" class="rol-input" placeholder="思绪万千...">
        </div>
        <div class="rol-form-group">
            <label>💝 摘要</label>
            <textarea id="rol-editor-summary" class="rol-input rol-textarea" rows="3" placeholder="连接你与我的距离..."></textarea>
        </div>
        <div class="rol-form-group">
            <label>🔅 酿造笔记</label>
            <textarea id="rol-editor-letter" class="rol-input rol-textarea rol-textarea-lg" rows="8" placeholder="如果能把全部记下来..."></textarea>
        </div>
        <div class="rol-form-group" id="rol-version-group">
            <label>🍰 历史配方</label>
            <select id="rol-version-select" class="rol-input"></select>
        </div>
        <!-- ┣━━⭐️ 确保有保存和取消按钮 / 三按钮：保存（粉色）、重写（橙色）、取消（灰色）━━┫ -->
        <div class="rol-editor-actions">
            <button id="rol-editor-save" class="rol-btn rol-btn-save">🍊 结果</button>
            <button id="rol-editor-rewrite" class="rol-btn rol-btn-rewrite" style="display:none;">🧡 再酿造</button>
            <button id="rol-editor-cancel" class="rol-btn rol-btn-cancel">💦ʢ>д<ʡ等等！</button>
        </div>
    </div>
</div>

<!-- ┣━━⭐️ AI来源选择面板（含楼层范围 + 隐藏消息开关）━━┫ -->
<div id="rol-ai-source-panel" class="rol-ai-source-panel">
    <div class="rol-ai-source-inner">
        <h3 class="rol-editor-heading">🧡 让Claude酿造</h3>
        <p class="rol-ai-source-desc">笨蛋要好好记住哦</p>
        <div class="rol-ai-source-options">
            <!-- ┣━━楼层范围选择器（替换原来的"从当前聊天生成"按钮）━━┫ -->
            <div class="rol-ai-chat-section">
                <div class="rol-ai-section-header">
                    <span class="rol-ai-source-icon">🌿</span>
                    <span class="rol-ai-source-label">从当前温室生成</span>
                </div>
                <div class="rol-floor-range">
                    <div class="rol-floor-field">
                        <label>🌱 爱意发芽处</label>
                        <input type="number" id="rol-floor-start" class="rol-input rol-input-sm" value="0" min="0">
                    </div>
                    <div class="rol-floor-field">
                        <label>🍊 恋果结成日</label>
                        <input type="number" id="rol-floor-end" class="rol-input rol-input-sm" value="-1">
                    </div>
                </div>
                <!-- ┣━━⭐️ 包含已隐藏消息的开关━━┫ -->
                <label class="rol-checkbox-label">
                    <input type="checkbox" id="rol-include-hidden"> 🍥 包含隐藏的结晶
                </label>
                <button id="rol-ai-from-chat" class="rol-btn rol-btn-ai rol-floor-gen-btn">🧡 酿造爱意</button>
            </div>
            <button id="rol-ai-from-paste" class="rol-ai-source-btn">
                <span class="rol-ai-source-icon">📋</span>
                <span class="rol-ai-source-label">🍒 从粘贴的结晶生成</span>
                <span class="rol-ai-source-hint">🌸 手动粘贴结晶...</span>
            </button>
        </div>
        <div id="rol-ai-paste-area" class="rol-ai-paste-area" style="display:none;">
            <textarea id="rol-ai-paste-input" class="rol-input rol-textarea" rows="6" placeholder="🍒 粘贴结晶..."></textarea>
            <button id="rol-ai-paste-confirm" class="rol-btn rol-btn-ai" style="margin-top:8px;">🧡 酿造爱意</button>
         </div>
         <div id="rol-ai-loading" class="rol-ai-loading" style="display:none;">
          <div id="rol-stop-gen" class="rol-stop-btn" style="display:none;">🔴 停止生成</div>
           <div class="rol-ai-spinner"></div>
            <span>🧡 Claude正在酿造中...</span>
        </div>
        <div class="rol-ai-source-footer">
            <button id="rol-ai-source-cancel" class="rol-btn rol-btn-cancel">💦ʢ>д<ʡ等等！</button>
        </div>
    </div>
</div>

<!-- ┣━━⭐️ 信件视图面板━━┫ -->
<div id="rol-letter-panel" class="rol-letter-panel" data-mem-id="">
    <div class="rol-letter-inner">
        <div class="rol-letter-header">
            <span id="rol-letter-title" class="rol-letter-title"></span>
            <button id="rol-letter-close" class="rol-btn rol-btn-icon">✕</button>
        </div>
        <div id="rol-letter-mood" class="rol-letter-mood"></div>
        <div id="rol-letter-body" class="rol-letter-body"></div>
        <div class="rol-letter-footer">
            <div id="rol-letter-version-group">
                <select id="rol-letter-version" class="rol-input"></select>
            </div>
            <div class="rol-letter-actions">
                <button id="rol-letter-edit" class="rol-btn">🩷 传入爱意</button>
                <button id="rol-letter-rewrite" class="rol-btn">🧡 再酿造</button>
            </div>
        </div>
    </div>
</div>

<!-- ┣━━⭐️ 果子选择面板（丢果子浮层）━━┫ -->
<div id="rol-fruit-picker-panel" class="rol-fruit-picker-panel">
  <div class="rol-fruit-picker-inner">
    <div class="rol-fruit-picker-header">
      <span class="rol-fruit-picker-title">🍎 丢个果子</span>
      <button id="rol-fruit-picker-close" class="rol-btn rol-btn-icon">✕</button>
    </div>
    <!-- ┣━━横向滑动选果区━━┫ -->
    <div class="rol-fruit-picker-scroll-wrap">
      <div id="rol-fruit-picker-track" class="rol-fruit-picker-track">
        <div class="rol-fruit-option" data-emoji="🍎">🍎</div>
        <div class="rol-fruit-option" data-emoji="🍊">🍊</div>
        <div class="rol-fruit-option" data-emoji="🍋">🍋</div>
        <div class="rol-fruit-option" data-emoji="🍇">🍇</div>
        <div class="rol-fruit-option" data-emoji="🍓">🍓</div>
        <div class="rol-fruit-option" data-emoji="🍑">🍑</div>
        <div class="rol-fruit-option" data-emoji="🍒">🍒</div>
        <div class="rol-fruit-option" data-emoji="🥝">🥝</div>
        <div class="rol-fruit-option" data-emoji="🍈">🍈</div>
        <div class="rol-fruit-option" data-emoji="🫐">🫐</div>
        <div class="rol-fruit-option" data-emoji="🍌">🍌</div>
        <div class="rol-fruit-option" data-emoji="🍉">🍉</div>
      </div>
    </div>
    <!-- ┣━━纸条输入区━━┫ -->
    <textarea id="rol-fruit-note" class="rol-input rol-textarea" rows="3" placeholder="附张纸条？（可以空着）"></textarea>
    <!-- ┣━━操作按钮━━┫ -->
    <div class="rol-fruit-picker-actions">
      <button id="rol-fruit-throw-btn" class="rol-btn rol-btn-primary">我丢！</button>
      <button id="rol-fruit-cancel-btn" class="rol-btn rol-btn-cancel">算了</button>
    </div>
  </div>
</div>

<!-- ┣━━⭐️ 果子详情弹窗━━┫ -->
<div id="rol-fruit-detail-popup" class="rol-fruit-detail-popup" style="display:none;">
  <div class="rol-fruit-detail-inner">
    <button id="rol-fruit-detail-close" class="rol-btn rol-btn-icon rol-fruit-detail-close">✕</button>
    <div id="rol-fruit-detail-emoji" class="rol-fruit-detail-emoji"></div>
    <div id="rol-fruit-detail-from" class="rol-fruit-detail-from"></div>
    <div id="rol-fruit-detail-note" class="rol-fruit-detail-note"></div>
    <div id="rol-fruit-detail-time" class="rol-fruit-detail-time"></div>
  </div>
</div>

<!-- ┣━━⭐️ 确认弹窗━━┫ -->
<div id="rol-confirm-modal" class="rol-confirm-overlay" style="display:none;">
  <div class="rol-confirm-box">
    <div class="rol-confirm-icon">🥀</div>
    <div class="rol-confirm-msg" id="rol-confirm-text"></div>
    <div class="rol-confirm-buttons">
      <button id="rol-confirm-yes" class="rol-confirm-btn rol-btn-yes">再试一次</button>
      <button id="rol-confirm-no" class="rol-confirm-btn rol-btn-no">算了</button>
    </div>
  </div>
</div>
